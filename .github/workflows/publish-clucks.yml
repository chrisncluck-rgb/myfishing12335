name: Publish Clucks APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-clucks.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -L --fail 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-e1d0-81fd-a9d7-538c298c241d/raw?se=2026-08-15T01%3A56%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=67d5a2ee-b8a8-41da-ad40-6a35639b99e8&skoid=fadb8e47-d3c7-4c79-a9c3-970d9af3b213&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-14T23%3A39%3A07Z&ske=2026-08-15T23%3A39%3A07Z&sks=b&skv=2026-02-06&sig=HrtwdIs62NVHandxEFMduIwgTi6C10qw8xpsl7ffnVE%3D' -o artifact.zip
          unzip artifact.zip
          mv app-debug.apk Clucks.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.5.4 --repo ${{ github.repository }} --cleanup-tag --yes || true
          gh release create v1.5.4 Clucks.apk --repo ${{ github.repository }} --title "Clucks 1.5.4 Field Test" --notes "Fixes Lakes Near Me so official USGS lake names are returned and ranked correctly."
