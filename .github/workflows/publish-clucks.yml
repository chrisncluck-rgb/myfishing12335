name: Publish Clucks APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-clucks.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed APK artifact
        run: |
          curl -L --fail 'https://sdmntprwestus.oaiusercontent.com/files/00000000-1744-8230-87ff-80445ed163af/raw?se=2026-08-15T00%3A11%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=2803000e-01ec-42cc-ac5b-64983ba76616&skoid=89c13f8f-c33a-46d8-9bf3-ad7158c7790a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-14T23%3A31%3A27Z&ske=2026-08-15T23%3A31%3A27Z&sks=b&skv=2026-02-06&sig=hRi24RxLLvbGY2nCqNATuiKv6dg8SUfKygQ2sF5wGfk%3D' -o artifact.zip
          unzip artifact.zip
          mv app-debug.apk Clucks.apk
      - name: Publish version 1.5.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.5.1 --repo ${{ github.repository }} --cleanup-tag --yes || true
          gh release create v1.5.1 Clucks.apk --repo ${{ github.repository }} --title "Clucks 1.5.1 Field Test" --notes "Fishing-specific package recognition, unified QR/barcode scanning, water- and species-specific guided tips, and automatic update checks."
