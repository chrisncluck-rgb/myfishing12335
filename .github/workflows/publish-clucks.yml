name: Publish Clucks APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-clucks.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed APK artifact
        run: |
          curl -L --fail 'https://sdmntprwestus.oaiusercontent.com/files/00000000-5e38-8230-8c71-2076c32557f3/raw?se=2026-08-15T01%3A04%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=7bf7adff-3ba4-4b86-ac56-e0964555f372&skoid=89c13f8f-c33a-46d8-9bf3-ad7158c7790a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-14T23%3A33%3A17Z&ske=2026-08-15T23%3A33%3A17Z&sks=b&skv=2026-02-06&sig=g0AoYwvJEvVz5WRowHT9WbTf/Fa2eHGhPzm90Jx%2BTeA%3D' -o artifact.zip
          unzip artifact.zip
          mv app-debug.apk Clucks.apk
      - name: Publish version 1.5.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.5.2 --repo ${{ github.repository }} --cleanup-tag --yes || true
          gh release create v1.5.2 Clucks.apk --repo ${{ github.repository }} --title "Clucks 1.5.2 Field Test" --notes "Automatic state fishing-guide labels using selected water, GPS or profile ZIP; manual state override; and freshwater lake/reservoir lookup across all 50 states."
