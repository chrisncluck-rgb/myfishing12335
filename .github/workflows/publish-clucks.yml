name: Publish Clucks APK
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-clucks.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed APK artifact
        run: |
          curl -L --fail 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-2df0-81fb-acdd-3a9b5efcb167/raw?se=2026-08-15T01%3A39%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=03563b6f-293b-4514-bbdd-6478a87da7a9&skoid=80e81ea6-3c08-46f9-bd84-b87176742bcd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-14T23%3A49%3A44Z&ske=2026-08-15T23%3A49%3A44Z&sks=b&skv=2026-02-06&sig=xCPVWzpEP2AwlEQJ3NusbWh3wW/6SB7IVUZGRJLCyvg%3D' -o artifact.zip
          unzip artifact.zip
          mv app-debug.apk Clucks.apk
      - name: Publish version 1.5.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.5.3 --repo ${{ github.repository }} --cleanup-tag --yes || true
          gh release create v1.5.3 Clucks.apk --repo ${{ github.repository }} --title "Clucks 1.5.3 Field Test" --notes "Reliable in-app Journal camera and GPS-ranked freshwater lakes and reservoirs within 20 miles using official USGS hydrography."
