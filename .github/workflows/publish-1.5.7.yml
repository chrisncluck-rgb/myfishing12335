name: Publish Clucks 1.5.7

on:
  push:
    paths:
      - .github/workflows/publish-1.5.7.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed APK artifact
        env:
          APK_ARTIFACT_URL: "https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-1400-81fb-ad83-d83ef1c793d2/raw?se=2026-08-15T03%3A30%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=abdef954-e59b-4417-89ed-5b034f496974&skoid=18c14e53-ea0c-429b-8d09-d22d66ca7169&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-14T23%3A22%3A00Z&ske=2026-08-15T23%3A22%3A00Z&sks=b&skv=2026-02-06&sig=JCWvRnVYNfmLYsn2G0ZD4Jd2PvSkDV8Yz/qXJfM4TlA%3D"
        run: |
          curl -L --fail "$APK_ARTIFACT_URL" -o release.zip
          unzip release.zip
          mv app-debug.apk Clucks.apk
          test -s Clucks.apk
      - name: Publish tester release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.5.7 Clucks.apk \
            --repo "${{ github.repository }}" \
            --title "Clucks 1.5.7" \
            --notes "Journal camera clarity improvement, simplified Game Plan water selection, and the new offline Knot & Rig Lab with 10 essential knots plus species-based freshwater rigs."
