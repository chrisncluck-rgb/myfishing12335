name: Publish Clucks 1.5.8

on:
  push:
    paths:
      - .github/workflows/publish-1.5.8.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed APK artifact
        env:
          APK_ARTIFACT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-c478-81fd-b12c-7ab14f70bda7/raw?se=2026-08-15T03%3A59%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=6b26b3da-40fc-4c36-a5f7-6b122a5bfdb8&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-14T23%3A33%3A37Z&ske=2026-08-15T23%3A33%3A37Z&sks=b&skv=2026-02-06&sig=AUG8zxL15sFOxnut/BXPK1VOTyCbdBmo9PaH9bVsORc%3D"
        run: |
          curl -L --fail "$APK_ARTIFACT_URL" -o release.zip
          unzip release.zip
          mv app-debug.apk Clucks.apk
          test -s Clucks.apk
      - name: Publish tester hotfix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.5.8 Clucks.apk \
            --repo "${{ github.repository }}" \
            --title "Clucks 1.5.8" \
            --notes "Hotfix: registers the offline Knot & Rig Lab correctly so it opens instead of closing the app."
